########################
#    Miscellaneous     #
########################
# Change keyboard default display name
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc PxJ"
# Decrease keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Increase debounce, reduce potential wear on the flash memory by reducing writes
#CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=90000
# Smaller debounce when using Smaller idle and sleep times since the kb will not save before entering sleep
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=15000

CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=4
########################


####################
#    Bluetooth     #
####################
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# increase transmission power, helps bt to work over larger distances between the central and peripheral
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# double transmission bit rate but greater chances of drops on poor or older bt hardware
# enabling it also reduces the distance between central and host and more importantly central peripheral which become more sensitive to distance between each other
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_BT_CTLR_ADVANCED_FEATURES=y
#CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CONN_PARAM_ANY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

####################


############################
# Soft & Deep Sleep config #
############################
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (5 minutes)
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
# Milliseconds of inactivity before entering deep sleep (15 minutes)
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
#CONFIG_NICE_OLED_CENTRAL_INACTIVITY_TIMEOUT_MS=25000
############################


################
#  OLED Config #
################
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_WIDGET_CAPS_LOCK_RGB_FLASH=y

CONFIG_NICE_OLED_WIDGET_INVERTED=n

CONFIG_NICE_OLED_CENTRAL_INACTIVITY_USE_INTERNAL_EVENTS=y
#CONFIG_LV_Z_MEM_POOL_SIZE=4608
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=356
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4596
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_NICE_OLED_BATTERY_SMOOTHING=y
CONFIG_NICE_OLED_BATTERY_DURATION_5_TO_100_MINUTES=300
#CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
#CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096 con

CONFIG_ZMK_KEYPRESS_EVENTS=y
####################


####################
# Mouse/pointing config
####################
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
####################


################
#  RGB CONFIG  #
################
CONFIG_SSD1306=y
CONFIG_ZMK_RGB_UNDERGLOW=y

# Both of these need to be true, in zmk 0.3 + zephyr 4.1 this fixes the issue of rgb remaining off when waking up from deep sleep or reset if AUTO_OFF_IDLE was set and if both were set in zmk 0.3 the rgb would start regardless of whether it was off before entering sleep. zmk 0.4 fixes both issues from what I can observe in my kb
# issue link https://github.com/zmkfirmware/zmk/issues/1376
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Turn off RGB when keyboard enters idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=1
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=2
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
###################
