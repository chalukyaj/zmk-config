# ZMK Studio config
# ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=180
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=1800

# OLED config
CONFIG_ZMK_DISPLAY=y
# RAW HID
CONFIG_NICE_OLED_WIDGET_RAW_HID=n

CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y

CONFIG_NICE_OLED_WIDGET_RAW_HID_WEATHER=n

CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME=y

CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT=y
# the same list needs to be in .json array of zmk-hid-host, only works for X11, wayland is not supported
#CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT_LIST="DE,US,LA,AB,IN"
# Raw HID End

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_CAPS_LOCK_WITH_SHIFT_CENTRAL=y
#CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=n

CONFIG_NICE_OLED_WIDGET_RAW_HID=n
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT=y

CONFIG_NICE_OLED_WIDGET_WPM=y
#CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
#CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n

CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=360
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=90
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
